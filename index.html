<!DOCTYPE html>
<html>
<head>
    <title>House Price Predictor</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: white;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            backdrop-filter: blur(15px);
            background: rgba(255, 255, 255, 0.08);
            padding: 20px;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
        }

        h2 {
            text-align: center;
            color: #38bdf8;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin: 10px 0;
        }

        label {
            margin-bottom: 5px;
        }

        input, select {
            padding: 10px;
            border-radius: 6px;
            border: none;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #38bdf8;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            text-align: center;
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>🏠 House Price Predictor</h2>

    <div class="form-group">
        <label>House Size</label>
        <input id="size" type="number">
    </div>

    <div class="form-group">
        <label>Bedrooms</label>
        <input id="bedrooms" type="number">
    </div>

    <div class="form-group">
        <label>Age</label>
        <input id="age" type="number">
    </div>

    <div class="form-group">
        <label>Location</label>
        <select id="location">
            <option>Urban</option>
            <option>Suburban</option>
        </select>
    </div>

    <div class="form-group">
        <label>Type</label>
        <select id="type">
            <option>Apartment</option>
            <option>Villa</option>
            <option>Bungalow</option>
        </select>
    </div>

    <div class="form-group">
        <label>Condition</label>
        <select id="condition">
            <option>Good</option>
            <option>Excellent</option>
            <option>Poor</option>
        </select>
    </div>

    <div class="form-group">
        <label>Furnishing</label>
        <select id="furnishing">
            <option>Furnished</option>
            <option>Semi-Furnished</option>
            <option>Unfurnished</option>
        </select>
    </div>

    <button onclick="predict()">Predict Price</button>

    <div id="result"></div>

</div>

<script>
function predict() {

    document.getElementById("result").innerText = "⏳ Predicting...";

    let data = {
        house_size_sqft: document.getElementById("size").value,
        num_bedrooms: document.getElementById("bedrooms").value,
        age_of_house_years: document.getElementById("age").value,
        location: document.getElementById("location").value,
        house_type: document.getElementById("type").value,
        condition: document.getElementById("condition").value,
        furnishing: document.getElementById("furnishing").value
    };

    fetch("/predict", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(result => {

        if (result.error) {
            document.getElementById("result").innerText = "⚠️ " + result.error;
            return;
        }

        let price = Number(result.predicted_price_usd).toLocaleString('en-IN', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });

        document.getElementById("result").innerText = "💰 ₹ " + price;
    })
    .catch(() => {
        document.getElementById("result").innerText = "❌ Server error";
    });
}
</script>

</body>
</html>
